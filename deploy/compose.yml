# plink-admin 서버 배포용 compose (dev/prod 공용)
#
# 환경마다 디렉터리를 따로 두고 이 파일을 복사해서 쓴다.
#   /srv/plink-admin/dev/{compose.yml, .env}
#   /srv/plink-admin/prod/{compose.yml, .env}
#
# .env : compose 변수 (deploy/env.example 참고). 비밀값이 없어 app.env는 따로 두지 않는다.
#
# 자세한 절차는 docs/deploy/docker.md 참고.

services:
  admin:
    image: ${IMAGE:?IMAGE is required}:${TAG:?TAG is required}
    init: true # SIGTERM을 node에 전달 (node가 PID 1이면 신호가 무시됨)
    restart: unless-stopped
    environment:
      # 쿠키 이름과 화면의 환경 표시를 정한다. dev/prod가 같은 도메인이라 반드시 맞게 넣는다.
      APP_ENV: ${APP_ENV:?APP_ENV is required}
      EXTERNAL_API_URL: ${EXTERNAL_API_URL:?EXTERNAL_API_URL is required}
      TZ: Asia/Seoul
      # docker가 넣는 HOSTNAME(컨테이너 id)으로 바인딩하지 않도록 명시한다.
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${HOST_PORT:?HOST_PORT is required}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/alive').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
