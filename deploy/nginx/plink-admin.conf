# plink-admin nginx 설정 (dev/prod 한 서버, 한 도메인)
#
#   prod: https://plink-admin.funx.ai        (443) → 127.0.0.1:3100
#   dev : https://plink-admin.funx.ai:8443   (8443) → 127.0.0.1:3101
#   http://plink-admin.funx.ai (80)은 prod https로 리다이렉트하고, 인증서 발급·갱신(ACME)에 쓴다.
#
# 컨테이너 포트는 deploy/compose.yml의 HOST_PORT와 맞춘다. (dev 3101, prod 3100, 127.0.0.1에만 바인딩)
# plink-api(plink-api.funx.ai)와 같은 80/443/8443을 쓰며, server_name(SNI)으로 구분된다.
#
# 설치 순서 (인증서 파일이 없으면 nginx -t가 실패하므로, 이 파일을 활성화하기 전에 인증서부터 받는다)
#   1. DNS에 plink-admin.funx.ai A 레코드 등록 (plink-api.funx.ai와 같은 서버 IP)
#   2. sudo certbot certonly --nginx -d plink-admin.funx.ai
#   3. 이 파일을 /etc/nginx/sites-available/plink-admin.funx.ai 로 복사하고
#      sudo ln -s /etc/nginx/sites-available/plink-admin.funx.ai /etc/nginx/sites-enabled/
#   4. sudo nginx -t && sudo systemctl reload nginx
# 인증서는 certbot 타이머가 80 포트로 자동 갱신한다. (확인: sudo certbot renew --dry-run)
#
# 주의: Host 헤더는 $host가 아니라 $http_host(포트 포함)를 넘긴다.
#   Next.js는 Server Action 요청의 Origin과 Host를 비교하고(CSRF 방지), 리다이렉트 URL도 Host로 만든다.
#   $host는 포트를 버리므로 8443에서 로그인(Server Action)이 거부되고, /login 리다이렉트가 443(prod)으로 간다.

upstream plink_admin_prod {
    server 127.0.0.1:3100;
    keepalive 16;
}

upstream plink_admin_dev {
    server 127.0.0.1:3101;
    keepalive 8;
}

# ── http (80): https 리다이렉트 + 인증서 갱신 ──
server {
    listen 80;
    listen [::]:80;
    server_name plink-admin.funx.ai;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── prod (443) ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name plink-admin.funx.ai;

    ssl_certificate     /etc/letsencrypt/live/plink-admin.funx.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plink-admin.funx.ai/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    access_log /var/log/nginx/plink-admin-prod.access.log;
    error_log  /var/log/nginx/plink-admin-prod.error.log;

    # Server Action 기본 bodySizeLimit(1MB)보다 약간 크게 둔다. 초과 요청은 Next.js가 응답한다.
    client_max_body_size 2m;

    # 관리자 페이지이므로 접근 IP를 제한하려면 주석을 푼다.
    # allow <사무실 IP>;
    # deny  all;

    location / {
        proxy_pass http://plink_admin_prod;
        proxy_http_version 1.1;
        proxy_set_header Connection "";          # upstream keepalive

        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}

# ── dev (8443) ──
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name plink-admin.funx.ai;

    ssl_certificate     /etc/letsencrypt/live/plink-admin.funx.ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plink-admin.funx.ai/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    # http://...:8443 으로 들어온 요청(497)을 https로 돌려보낸다.
    error_page 497 =301 https://$host:8443$request_uri;

    access_log /var/log/nginx/plink-admin-dev.access.log;
    error_log  /var/log/nginx/plink-admin-dev.error.log;

    client_max_body_size 2m;

    # allow <사무실 IP>;
    # deny  all;

    location / {
        proxy_pass http://plink_admin_dev;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
